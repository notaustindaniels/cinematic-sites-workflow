name: cinematic-site
description: |
  Turn a website or business idea into a cinematic, scroll-animated landing page with an
  AI hero video (Higgsfield: Flux.2 Pro + Seedance 2.0 Fast), then build and deploy it.
  Decomposed, schema-constrained, critic-verified pipeline tuned so weak models match the
  cinematic-site-kit-higgsfield skill's quality. Gated at each PAUSE point.
  Use when the user wants a cinematic landing page, scroll-animated / scrollytelling site,
  a hero-video marketing page, or wants to make an existing site "cinematic" with Higgsfield.
  NOT for generic product photos, Remotion videos, or non-cinematic sites.
provider: claude
model: sonnet              # default tier; per-node overrides below (generation-plan, showcase-director, door-check → opus)
interactive: true
thinking: adaptive
worktree:
  enabled: false  # in-place run: archon's worktree manager errors on this host
  # (raw `git worktree add` works; trustworthiness comes from committing .archon/
  # — the tree is clean and run artifacts are written outside the repo).

nodes:
  # ════════════════════════════════ A. PREFLIGHT & GUARDS ════════════════════════════════
  - id: preflight
    script: preflight
    runtime: bun
    timeout: 90000

  - id: require-higgsfield
    cancel: "Higgsfield CLI not found or not authenticated. Install it and run `higgsfield auth login`, then re-run."
    depends_on: [preflight]
    when: "$preflight.output.higgsfield == 'false'"

  - id: require-ffmpeg
    cancel: "ffmpeg is required for scroll-frame extraction. Install ffmpeg (brew install ffmpeg) and re-run."
    depends_on: [preflight]
    when: "$preflight.output.ffmpeg == 'false'"

  - id: warn-credits
    bash: |
      echo "⚠ Higgsfield credit balance is low ($preflight.output.credits). A full hero + grid showcase run can cost ~120-180 credits. Consider topping up before approving the generation plan."
    depends_on: [preflight]
    when: "$preflight.output.credits < '120'"
    trigger_rule: all_done

  # ════════════════════════════════ B. INTAKE ════════════════════════════════
  - id: intake-draft
    command: intake-draft
    depends_on: [preflight]
    when: "$preflight.output.higgsfield == 'true'"
    context: fresh
    skills: [cinematic-site-kit-higgsfield]
    output_format:
      type: object
      properties:
        mode: { type: string, enum: [existing-site, business-concept] }
        business_name: { type: string }
        services: { type: array, items: { type: string } }
        city: { type: string }
        service_area: { type: string }
        customers: { type: string }
        ideal_customer: { type: string }
        ticket_band: { type: string }
        mood: { type: array, items: { type: string } }
        references: { type: array, items: { type: string } }
        donots: { type: array, items: { type: string } }
        want_showcase: { type: string, enum: ['true', 'false'] }
        want_before_after: { type: string, enum: ['true', 'false'] }
        brands: { type: array, items: { type: string } }
        deploy_target: { type: string, enum: [vercel, local] }
        domain: { type: string }
        existing_assets: { type: string }
        open_questions: { type: array, items: { type: string } }
      required: [mode, business_name, services, city, service_area, customers, mood, want_showcase, want_before_after, deploy_target, open_questions]

  - id: intake-check
    script: intake-check
    runtime: bun
    depends_on: [intake-draft]
    timeout: 20000

  - id: intake-gate
    approval:
      message: |
        STEP 0 — Review the client brief at $ARTIFACTS_DIR/intake-brief.md and the open questions it lists.
        Reject with answers to any open/vague items to refine the brief; approve when it is accurate and complete.
      capture_response: true
      on_reject:
        prompt: |
          Fold these answers into $ARTIFACTS_DIR/intake-brief.md and $ARTIFACTS_DIR/intake.json (keep both in sync,
          same JSON shape). Resolve any now-answered open_questions, remove them from the list, and re-ask anything
          still vague — pleasantly persistent, never assume a MUST-HAVE (services/city/customers). Human feedback:
          $REJECTION_REASON
        max_attempts: 6
    depends_on: [intake-draft, intake-check]

  # ════════════════════════════════ C. BRAND ════════════════════════════════
  - id: brand-system
    command: brand-system
    depends_on: [intake-gate]
    context: fresh
    skills: [cinematic-site-kit-higgsfield]
    output_format:
      type: object
      properties:
        business_name: { type: string }
        industry: { type: string }
        color_bg: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        color_primary: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        color_secondary: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        color_accent: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        color_text: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        font_heading: { type: string }
        font_body: { type: string }
        font_heading_name: { type: string }
        font_body_name: { type: string }
        google_fonts_url: { type: string }
        headline: { type: string }
        tagline: { type: string }
        hero_line: { type: string }
        sections:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              title: { type: string }
              body: { type: string }
            required: [key, title, body]
        theme_direction: { type: string }
        mood: { type: array, items: { type: string }, minItems: 4, maxItems: 4 }
      required: [business_name, industry, color_bg, color_primary, color_secondary, color_accent, color_text, font_heading, font_body, font_heading_name, font_body_name, google_fonts_url, headline, tagline, hero_line, sections, theme_direction, mood]

  - id: brand-card
    script: brand-card
    runtime: bun
    depends_on: [brand-system]
    timeout: 30000

  - id: brand-critic
    prompt: |
      You are a strict brand-consistency critic. Read the rubric at
      .archon/assets/cinematic/rubrics/brand.md and apply it VERBATIM as your bar.
      Judge $ARTIFACTS_DIR/brand/brand-system.json against the client brief at
      $ARTIFACTS_DIR/intake-brief.md (and $ARTIFACTS_DIR/intake.json).
      Write your full verdict to $ARTIFACTS_DIR/brand/brand-verdict.json, then return the same verdict.
    depends_on: [brand-system]
    context: fresh
    allowed_tools: [Read, Write]
    output_format:
      type: object
      properties:
        verdict: { type: string, enum: [PASS, FAIL] }
        reasons: { type: array, items: { type: string } }
        fixes: { type: array, items: { type: string } }
      required: [verdict, reasons, fixes]

  - id: brand-gate
    approval:
      message: |
        STEP 1 — Open $ARTIFACTS_DIR/brand/brand-card.html in a browser to review the brand system.
        The automated critic verdict is in $ARTIFACTS_DIR/brand/brand-verdict.json.
        Approve to lock the brand, or reject with specific changes (colors/fonts/copy).
      capture_response: true
      on_reject:
        prompt: |
          Revise $ARTIFACTS_DIR/brand/brand-system.json to address the critic reasons in
          $ARTIFACTS_DIR/brand/brand-verdict.json AND this human feedback: $REJECTION_REASON
          Keep all hex 6-digit and fonts real Google Fonts. Then rebuild the card by running:
          `bun .archon/scripts/brand-card.ts`. Keep brand-system.json and the card in sync.
        max_attempts: 5
    depends_on: [brand-card, brand-critic]

  # ════════════════════════════════ D. GENERATION PLAN (keystone) ════════════════════════════════
  - id: generation-plan
    command: generation-plan
    depends_on: [brand-gate]
    context: fresh
    model: opus
    skills: [cinematic-site-kit-higgsfield]
    output_format:
      type: object
      properties:
        showcase_enabled: { type: string, enum: ['true', 'false'] }
        before_after_enabled: { type: string, enum: ['true', 'false'] }
        hero:
          type: object
          properties:
            reference_prompt: { type: string }
            want_end_frame: { type: string, enum: ['true', 'false'] }
            variants: { type: integer, minimum: 1, maximum: 4 }
            duration: { type: integer, minimum: 4, maximum: 12 }
          required: [reference_prompt, want_end_frame, variants, duration]
        modules: { type: array, items: { type: string } }
        scroll_heights:
          type: object
          properties:
            hero: { type: string }
            showcase: { type: string }
          required: [hero, showcase]
        deploy:
          type: object
          properties:
            target: { type: string, enum: [vercel, local] }
            domain: { type: string }
          required: [target]
      required: [showcase_enabled, before_after_enabled, hero, modules, scroll_heights, deploy]

  - id: plan-critic
    prompt: |
      You are a strict generation-plan critic. Read the rubric at
      .archon/assets/cinematic/rubrics/plan.md and apply it VERBATIM.
      Judge $ARTIFACTS_DIR/plan.json against the brief ($ARTIFACTS_DIR/intake-brief.md) and brand
      ($ARTIFACTS_DIR/brand/brand-system.json). Verify: only requested optional assets are planned
      (no unrequested showcase / before-after), Brand Logo Marquee is present iff brands exist,
      Before/After Slider is present iff before_after is enabled, and the showcase scenes form a sound
      2-keyframe-per-scene chain — each end_state REVEALS what was already visible in its start_state
      (never invents an unseen space), each scene after the first reuses the prior end_state as its
      start_state, and each non-final scene seeds the next. Do NOT police camera ambition. Write your
      verdict to $ARTIFACTS_DIR/plan-verdict.json, then return the same verdict.
    depends_on: [generation-plan]
    context: fresh
    allowed_tools: [Read, Write]
    output_format:
      type: object
      properties:
        verdict: { type: string, enum: [PASS, FAIL] }
        reasons: { type: array, items: { type: string } }
        fixes: { type: array, items: { type: string } }
      required: [verdict, reasons, fixes]

  - id: plan-flatten
    script: plan-flatten
    runtime: bun
    depends_on: [generation-plan]
    timeout: 30000

  - id: plan-gate
    approval:
      message: |
        GENERATION PLAN — Review $ARTIFACTS_DIR/plan.json (and the critic verdict at
        $ARTIFACTS_DIR/plan-verdict.json). This is exactly what will be generated and the implied
        credit spend BEFORE any paid generation. Approve to start generating, or reject with changes.
      capture_response: true
      on_reject:
        prompt: |
          Revise $ARTIFACTS_DIR/plan.json to address the critic reasons in $ARTIFACTS_DIR/plan-verdict.json
          AND this human feedback: $REJECTION_REASON. Then re-flatten the work-item lists by running:
          `bun .archon/scripts/plan-flatten.ts`.
        max_attempts: 5
    depends_on: [plan-critic, plan-flatten]

  # ═══════════════════ E. HERO — above-the-fold START+END arrival (runs FIRST, always) ═══════════════════
  # The hero is a single A->B arrival. It REUSES the showcase Director + ALL its lessons (grid/heading path,
  # no-glimpse, zero-remnants, single-door handling) but renders from TWO frames — panel 1 = START, panel 2 = END
  # — not a composited grid. It shares the grid scripts/commands via the $ARTIFACTS_DIR/.cine-section MARKER:
  # hero-set-marker writes "hero", so every script + the Director + door-check resolve $A/hero, scenes/hero-grid,
  # and the final video lands at scenes/hero/hero-final.mp4 (what extract-frames reads). The hero is serialized
  # BEFORE the showcase (showcase-set-marker flips the marker back to "showcase" after hero-gate) so the global
  # marker is never raced.
  - id: hero-set-marker
    bash: |
      mkdir -p "$ARTIFACTS_DIR/hero" "$ARTIFACTS_DIR/scenes/hero-grid" "$ARTIFACTS_DIR/scenes/hero"
      printf 'hero' > "$ARTIFACTS_DIR/.cine-section"
      echo "cine-section -> hero (hero phase)"
    depends_on: [plan-gate]

  - id: hero-director
    command: showcase-director
    depends_on: [hero-set-marker]
    context: fresh
    model: opus
    skills: [cinematic-site-kit-higgsfield]
    output_format:
      type: object
      properties:
        style: { type: object }
        grid:
          type: object
          properties:
            cols: { type: integer, minimum: 1, maximum: 2 }
            rows: { type: integer, minimum: 1, maximum: 1 }
          required: [cols, rows]
        panels:                       # hero = a START+END pair: EXACTLY 2 panels (panel 1 = start, panel 2 = end)
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            properties:
              id: { type: string }
              scene_label: { type: string }
              composition: { type: string }
              nb_prompt: { type: string }
            required: [id, composition, nb_prompt]
        flythrough_prompt: { type: string }
        duration: { type: integer, minimum: 4, maximum: 15 }
      required: [style, grid, panels, flythrough_prompt, duration]

  - id: hero-refine-loop
    depends_on: [hero-director]
    idle_timeout: 600000
    loop:
      prompt: |
        You are the HERO Director acting as your own STRICT critic-and-reviser. Converge the 2-panel start/end
        spec to clean BEFORE any panel is generated. State lives in $ARTIFACTS_DIR/hero/grid-spec.json and
        $ARTIFACTS_DIR/hero/grid-verdict.json. Original brief: $ARGUMENTS

        1. CRITIQUE — read $ARTIFACTS_DIR/hero/grid-spec.json and apply the rubric at
           .archon/assets/cinematic/rubrics/grid.md VERBATIM and strictly. For the hero ALSO verify: EXACTLY 2
           panels [panel 1 = exterior approach to a SINGLE closed front door; panel 2 = the primary interior
           framed from WITHIN with NO door/entry in shot — ZERO-REMNANTS]; the flythrough opens the single door
           and TRAVELS into the interior toward a glass/feature wall; tight (<500 chars); no rig/aircraft words;
           no timestamps; phrase-level backtick emphasis balanced. Write your honest verdict
           {verdict,reasons[],fixes[]} to $ARTIFACTS_DIR/hero/grid-verdict.json.
        2. REVISE — if FAIL, edit $ARTIFACTS_DIR/hero/grid-spec.json to fix EVERY reason, then re-write
           $ARTIFACTS_DIR/hero/grid-verdict.json for the revised spec.
        3. SIGNAL — only if it now genuinely PASSes every check, output <promise>SPEC_OK</promise>. Otherwise end
           your turn and you will iterate again.
        Do NOT generate any images. Only read/edit grid-spec.json and grid-verdict.json.
      until: SPEC_OK
      max_iterations: 5
      fresh_context: true
      until_bash: 'ARTIFACTS_DIR="$ARTIFACTS_DIR" bun .archon/scripts/grid-verdict-passed.ts'

  - id: hero-panel-flatten
    script: panel-flatten      # reads the marker -> $A/hero/grid-spec.json -> $A/hero/plan.json
    runtime: bun
    depends_on: [hero-refine-loop]
    timeout: 30000

  - id: hero-panel-gen
    depends_on: [hero-panel-flatten]
    idle_timeout: 1200000
    loop:
      prompt: |
        FRESH iteration — no memory. State lives in $ARTIFACTS_DIR/hero/plan.json. The panel prompts were ALREADY
        WRITTEN by the Director — you do NOT change any prompt; you ONLY execute. Every plan-step.ts call MUST be
        prefixed `ARTIFACTS_DIR="$ARTIFACTS_DIR"`.

        1. Next panel:  ARTIFACTS_DIR="$ARTIFACTS_DIR" bun .archon/scripts/plan-step.ts --next hero
           If it prints NONE → output <promise>PANELS_DONE</promise> and stop.
        2. Parse the item JSON: id, refs[], out, prompt, scene_label.
        3. Write the item's prompt VERBATIM to $ARTIFACTS_DIR/hero/<id>.prompt.txt — do NOT edit it.
        4. Generate the panel (Flux.2 Pro, 2k):
           - with a ref (style anchor):  bun .archon/scripts/hf-image.ts --prompt-file <pf> --out <out> --image <refs[0]> --resolution 2k
           - first panel (no ref):       bun .archon/scripts/hf-image.ts --prompt-file <pf> --out <out> --resolution 2k
        5. If the output image exists:  ARTIFACTS_DIR="$ARTIFACTS_DIR" bun .archon/scripts/plan-step.ts --mark-done hero <id>
           If generation errored transiently, do NOT mark done — end the turn so it retries.
        6. Do exactly ONE panel per iteration, then end your turn.
      until: PANELS_DONE
      max_iterations: 8
      fresh_context: true
      until_bash: 'ARTIFACTS_DIR="$ARTIFACTS_DIR" bun .archon/scripts/plan-step.ts --all-done hero'

  - id: hero-compose
    script: compose-grid       # reads the marker -> composites $A/scenes/hero-grid/{p1,p2}.png -> grid.png (door-check + review)
    runtime: bun
    depends_on: [hero-panel-gen]
    timeout: 120000

  - id: hero-door-check
    command: door-check
    depends_on: [hero-compose]
    context: fresh
    model: opus
    allowed_tools: [Read, Write]
    output_format:
      type: object
      properties:
        hinged_door: { type: string, enum: [yes, no] }
        door_panel: { type: string }
        single_or_double: { type: string, enum: [single, double, n/a] }
        handle_side: { type: string, enum: [left, right, unclear, n/a] }
      required: [hinged_door, handle_side]

  - id: hero-door-swing
    script: door-swing         # reads the marker -> rewrites the door clause in $A/hero/grid-spec.json
    runtime: bun
    depends_on: [hero-door-check]
    timeout: 20000

  - id: hero-grid-gate
    approval:
      message: |
        STEP 1 (HERO STORYBOARD) — review the 2 panels BEFORE the paid render. Open
        $ARTIFACTS_DIR/scenes/hero-grid/grid.png: panel 1 = the START frame (exterior approach to the single
        door), panel 2 = the END frame (the interior landing). At render, Seedance gets panel 1 and panel 2 as the
        start/end frames (this grid is only for THIS review + door-check, not the render input) and interpolates
        between them under $ARTIFACTS_DIR/hero/grid-spec.json.flythrough_prompt (already a PASS verdict via the
        auto-revise loop). door-swing has set the single-door swing DETERMINISTICALLY from the observed handle
        side. Approve to render the ~5s hero, or reject naming the panel(s) to regenerate.
      capture_response: true
      on_reject:
        prompt: |
          For the panels named: $REJECTION_REASON — reset their status to "pending" in
          $ARTIFACTS_DIR/hero/plan.json (and if the prompt itself needs changing, edit that panel's nb_prompt in
          $ARTIFACTS_DIR/hero/grid-spec.json then re-run `bun .archon/scripts/panel-flatten.ts`). Regenerate the
          reset panel(s) via `bun .archon/scripts/hf-image.ts` using their pre-written prompt, then re-run
          `bun .archon/scripts/compose-grid.ts` to rebuild the grid.
        max_attempts: 5
    depends_on: [hero-compose, hero-door-swing]

  - id: hero-gen
    script: gen-hero-2frame    # reads the marker -> renders start(p1)+end(p2) -> $A/scenes/hero/hero-final.mp4
    runtime: bun
    depends_on: [hero-grid-gate]
    timeout: 1500000
    retry:
      max_attempts: 2
      delay_ms: 8000

  - id: hero-gate
    approval:
      message: |
        STEP 1 (HERO) — the ~5s arrival at $ARTIFACTS_DIR/scenes/hero/hero-final.mp4 (Seedance INTERPOLATES
        panel 1 -> panel 2 as the start/end frames). It should travel from the exterior, through the opening
        single door, into the interior as one continuous move and LAND on panel 2. Approve, or reject to re-render
        (tweak the flythrough in $ARTIFACTS_DIR/hero/grid-spec.json — keeping it duration-free — or regenerate a
        panel + re-compose).
      capture_response: true
      on_reject:
        prompt: |
          Address this feedback: $REJECTION_REASON. If it's the camera/journey, edit
          $ARTIFACTS_DIR/hero/grid-spec.json flythrough_prompt (NEVER add a duration/timestamp) and re-run
          `bun .archon/scripts/gen-hero-2frame.ts`. If a panel is wrong, reset it in $ARTIFACTS_DIR/hero/plan.json,
          regenerate via hf-image.ts, re-run `bun .archon/scripts/compose-grid.ts`, then
          `bun .archon/scripts/gen-hero-2frame.ts`.
        max_attempts: 4
    depends_on: [hero-gen]

  # ════════════════════════════════ F. SHOWCASE — GRID method (conditional) ════════════════════════════════
  # Seam-free GRID method: an opus Director designs same-style scene panels for ONE storyboard image, that single
  # image is fed to Seedance, and Seedance renders ONE continuous flythrough (no clips, no stitching, no seams —
  # so the whole class of seam/state bugs cannot occur). Gated on showcase_enabled; the entire chain skips (and the
  # downstream extract-frames tolerates the absent video) when the plan did not request a showcase.
  #
  # SHARED MODULE — this section MIRRORS the standalone `cinematic-showcase` workflow (.archon/workflows/
  # cinematic-showcase.yaml), which stays independently runnable and reusable by other workflows. Both wire the
  # SAME single-source building blocks — commands `showcase-director`/`door-check`, scripts panel-flatten/
  # compose-grid/gen-flythrough/door-swing/grid-verdict-passed, rubric grid.md — so the LOGIC lives in one place;
  # only this node wiring is mirrored. Keep the two F-sections in sync when the pipeline structure changes.
  - id: showcase-set-marker
    bash: |
      mkdir -p "$ARTIFACTS_DIR/showcase" "$ARTIFACTS_DIR/scenes/showcase-grid" "$ARTIFACTS_DIR/scenes/showcase"
      printf 'showcase' > "$ARTIFACTS_DIR/.cine-section"
      echo "cine-section -> showcase (showcase phase)"
    depends_on: [plan-gate, hero-gate]   # serialize the showcase AFTER the hero so the global marker is never raced

  - id: showcase-director
    command: showcase-director
    depends_on: [showcase-set-marker]
    when: "$generation-plan.output.showcase_enabled == 'true'"
    context: fresh
    model: opus
    skills: [cinematic-site-kit-higgsfield]
    output_format:
      type: object
      properties:
        style: { type: object }
        grid:
          type: object
          properties:
            cols: { type: integer, minimum: 1, maximum: 3 }
            rows: { type: integer, minimum: 1, maximum: 3 }
          required: [cols, rows]
        panels:
          type: array
          minItems: 2
          maxItems: 9
          items:
            type: object
            properties:
              id: { type: string }
              scene_label: { type: string }
              composition: { type: string }
              nb_prompt: { type: string }
            required: [id, composition, nb_prompt]
        flythrough_prompt: { type: string }
        duration: { type: integer, minimum: 4, maximum: 15 }
      required: [style, grid, panels, flythrough_prompt, duration]

  # AUTO-REVISE LOOP — the Director critiques its OWN spec against rubrics/grid.md (incl. the hard spatial checks:
  # every turn is a bounded angle + straight-ahead commit, turn direction matches the panel layout, no U-turn into
  # a seen space) and revises until it self-PASSes, BEFORE any panel is generated.
  - id: refine-loop
    depends_on: [showcase-director]
    idle_timeout: 600000
    loop:
      prompt: |
        You are the showcase Director acting as your own STRICT critic-and-reviser. Converge the storyboard spec
        to clean BEFORE any panel is generated. State lives in $ARTIFACTS_DIR/showcase/grid-spec.json and
        $ARTIFACTS_DIR/showcase/grid-verdict.json. Original brief: $ARGUMENTS

        1. CRITIQUE — read $ARTIFACTS_DIR/showcase/grid-spec.json and apply the rubric at
           .archon/assets/cinematic/rubrics/grid.md VERBATIM and strictly. Pay special attention to the HARD
           spatial checks: every turn is a BOUNDED ANGLE + direction FOLLOWED BY a straight-ahead commit ("turns
           90 degrees left to face the archway, then continues straight ahead through it"); each turn's named
           direction MATCHES the panel layout it reveals (cross-check against each panel's composition); no two
           same-direction turns that U-turn into a space already shown; tight (<500 chars); no rig/aircraft words
           ("flight/drone/aerial/fly/bank…"); ends on the final reveal (no padding closing). Write your honest
           verdict {verdict,reasons[],fixes[]} to $ARTIFACTS_DIR/showcase/grid-verdict.json.
        2. REVISE — if the verdict is FAIL, edit $ARTIFACTS_DIR/showcase/grid-spec.json to fix EVERY reason.
           Where a turn can't be both correct (matching its panel) AND paradox-free, RESTRUCTURE the path:
           re-order panels, route through a doorway, or use a level change — and update the affected panels'
           nb_prompt/composition to match. Keep every other rule satisfied. Then re-write grid-verdict.json for
           the REVISED spec.
        3. SIGNAL — only if the spec now genuinely PASSes every check, output <promise>SPEC_OK</promise>.
           Otherwise end your turn and you will iterate again.
        Do NOT generate any images. Only read/edit grid-spec.json and grid-verdict.json.
      until: SPEC_OK
      max_iterations: 5
      fresh_context: true
      until_bash: 'ARTIFACTS_DIR="$ARTIFACTS_DIR" bun .archon/scripts/grid-verdict-passed.ts'

  - id: panel-flatten
    script: panel-flatten
    runtime: bun
    depends_on: [refine-loop]   # panels only generate AFTER the spec converges to PASS
    timeout: 30000

  - id: panel-gen
    depends_on: [panel-flatten]
    idle_timeout: 1200000
    loop:
      prompt: |
        FRESH iteration — no memory. State lives in $ARTIFACTS_DIR/showcase/plan.json. The panel prompts were
        ALREADY WRITTEN by the Director — you do NOT write, improve, or change any prompt. You ONLY execute.
        IMPORTANT: every plan-step.ts call MUST be prefixed `ARTIFACTS_DIR="$ARTIFACTS_DIR"` — copy verbatim.

        1. Next panel:  ARTIFACTS_DIR="$ARTIFACTS_DIR" bun .archon/scripts/plan-step.ts --next showcase
           If it prints NONE → output <promise>PANELS_DONE</promise> and stop.
        2. Parse the item JSON: id, refs[], out, prompt, scene_label.
        3. Write the item's prompt VERBATIM to $ARTIFACTS_DIR/showcase/<id>.prompt.txt — do NOT edit it.
        4. Generate the panel (Flux.2 Pro, 2k):
           - with a ref (style anchor):  bun .archon/scripts/hf-image.ts --prompt-file <pf> --out <out> --image <refs[0]> --resolution 2k
           - first panel (no ref):       bun .archon/scripts/hf-image.ts --prompt-file <pf> --out <out> --resolution 2k
        5. If the output image exists, mark done:
             ARTIFACTS_DIR="$ARTIFACTS_DIR" bun .archon/scripts/plan-step.ts --mark-done showcase <id>
           If generation errored transiently, do NOT mark done — end the turn so it retries next iteration.
        6. Do exactly ONE panel per iteration, then end your turn.
      until: PANELS_DONE
      max_iterations: 24
      fresh_context: true
      until_bash: 'ARTIFACTS_DIR="$ARTIFACTS_DIR" bun .archon/scripts/plan-step.ts --all-done showcase'

  - id: compose-grid
    script: compose-grid
    runtime: bun
    depends_on: [panel-gen]
    timeout: 120000

  # DOOR — OBSERVE (vision) + COMPUTE (code). The AI node ONLY reports which side the handle is on; door-swing.ts
  # computes hinge = opposite handle, swing = hinge side, and rewrites the door clause deterministically.
  - id: door-check
    command: door-check
    depends_on: [compose-grid]
    context: fresh
    model: opus
    allowed_tools: [Read, Write]
    output_format:
      type: object
      properties:
        hinged_door: { type: string, enum: [yes, no] }
        door_panel: { type: string }
        single_or_double: { type: string, enum: [single, double, n/a] }
        handle_side: { type: string, enum: [left, right, unclear, n/a] }
      required: [hinged_door, handle_side]

  - id: door-swing
    script: door-swing
    runtime: bun
    depends_on: [door-check]
    timeout: 20000

  # GATE: review the composited grid BEFORE the paid Seedance render.
  - id: grid-gate
    approval:
      message: |
        STEP 2 (SHOWCASE GRID) — this single image is what gets fed to Seedance (review BEFORE the paid render).
        Open $ARTIFACTS_DIR/scenes/showcase-grid/grid.png — the panels should read as ONE space, one light,
        distinct vantages in journey order, each badged with its scene number. The Seedance flythrough prompt is
        grid-spec.json.flythrough_prompt (already converged to a PASS verdict via the auto-revise loop), and the
        door-swing step has set the single-door swing DETERMINISTICALLY from the observed handle side. Approve to
        render the flythrough, or reject naming the panel(s) to regenerate.
      capture_response: true
      on_reject:
        prompt: |
          For the panels named in this feedback: $REJECTION_REASON — reset their status to "pending" in
          $ARTIFACTS_DIR/showcase/plan.json (and, if the prompt itself needs changing, edit that panel's
          nb_prompt in $ARTIFACTS_DIR/showcase/grid-spec.json then re-run `bun .archon/scripts/panel-flatten.ts`).
          Regenerate the reset panel(s) via `bun .archon/scripts/hf-image.ts` using their pre-written prompt,
          then re-run `bun .archon/scripts/compose-grid.ts` to rebuild the grid.
        max_attempts: 5
    depends_on: [compose-grid, door-swing]

  # THE ONE SEEDANCE CALL — grid in, continuous flythrough out, to scenes/showcase/showcase-video.mp4.
  - id: gen-flythrough
    script: gen-flythrough
    runtime: bun
    depends_on: [grid-gate]
    timeout: 1500000   # one Seedance render (up to ~20m internal wait)
    retry:
      max_attempts: 2
      delay_ms: 8000

  - id: showcase-gate
    approval:
      message: |
        STEP 2 (SHOWCASE) — the single continuous flythrough at
        $ARTIFACTS_DIR/scenes/showcase/showcase-video.mp4 (one Seedance render from the grid — no seams). Watch
        it: it should travel through the spaces in order as one continuous cinematic move. Approve, or reject to
        re-render (tweak the flythrough prompt in grid-spec.json — keeping it duration-free — or regenerate a
        panel + re-compose the grid first).
      capture_response: true
      on_reject:
        prompt: |
          Address this feedback: $REJECTION_REASON. If it's the camera/journey, edit
          $ARTIFACTS_DIR/showcase/grid-spec.json flythrough_prompt (NEVER add a duration/timestamp to it) and
          re-run `bun .archon/scripts/gen-flythrough.ts`. If a panel is wrong, reset it in plan.json, regenerate
          via hf-image.ts, re-run `bun .archon/scripts/compose-grid.ts`, then `bun .archon/scripts/gen-flythrough.ts`.
        max_attempts: 4
    depends_on: [gen-flythrough]

  # ════════════════════════════════ G. BEFORE / AFTER (conditional loop) ════════════════════════════════
  - id: beforeafter-loop
    depends_on: [plan-gate]
    when: "$generation-plan.output.before_after_enabled == 'true'"
    idle_timeout: 1200000
    loop:
      prompt: |
        FRESH iteration — no memory. State lives in $ARTIFACTS_DIR/beforeafter/plan.json.
        IMPORTANT: every plan-step.ts command MUST be prefixed with `ARTIFACTS_DIR="$ARTIFACTS_DIR"` (your
        shell does not inherit it) — copy the commands below verbatim.

        1. Next pending pair:  ARTIFACTS_DIR="$ARTIFACTS_DIR" bun .archon/scripts/plan-step.ts --next beforeafter
           If NONE, output <promise>BEFOREAFTER_DONE</promise> and stop.
        2. Parse the pair JSON (id, caption, after_prompt, after_out, before_out).
        3. Generate the AFTER first, then derive the BEFORE from it
           (.archon/assets/cinematic/templates/beforeafter-template.md):
           - after:  bun .archon/scripts/hf-image.ts --prompt-file <afterpromptfile> --out <after_out> --resolution 2k
           - before: bun .archon/scripts/hf-image.ts --prompt-file <beforepromptfile> --out <before_out> --image <after_out> --resolution 2k
             (before prompt = "exactly like this reference, but [old/worn]; same composition, angle, lighting, environment")
        4. Critique against .archon/assets/cinematic/rubrics/beforeafter.md (the two must share composition so the
           slider lines up). If PASS:  ARTIFACTS_DIR="$ARTIFACTS_DIR" bun .archon/scripts/plan-step.ts --mark-done beforeafter <id>
        5. ONE pair per iteration, then end your turn.
      until: BEFOREAFTER_DONE
      max_iterations: 30
      fresh_context: true
      until_bash: 'ARTIFACTS_DIR="$ARTIFACTS_DIR" bun .archon/scripts/plan-step.ts --all-done beforeafter'

  - id: beforeafter-gate
    approval:
      message: |
        STEP 2 (BEFORE/AFTER) — Review the before/after pairs in $ARTIFACTS_DIR/scenes/beforeafter/.
        Each pair must share composition so the slider lines up. Approve or reject with the pair + issue.
      capture_response: true
      on_reject:
        prompt: |
          For the pairs called out in: $REJECTION_REASON — reset their status to "pending" in
          $ARTIFACTS_DIR/beforeafter/plan.json and regenerate (after-first, then before via --image).
        max_attempts: 4
    depends_on: [beforeafter-loop]

  # ════════════════════════════════ H. BUILD ════════════════════════════════
  - id: extract-frames
    script: extract-frames
    runtime: bun
    depends_on: [hero-gate, showcase-gate, beforeafter-gate]
    trigger_rule: none_failed_min_one_success
    timeout: 300000

  - id: site-plan
    command: site-plan
    depends_on: [extract-frames]
    context: fresh
    skills: [cinematic-site-kit-higgsfield]
    output_format:
      type: object
      properties:
        nav_links: { type: array, items: { type: string } }
        sections:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              copy: { type: string }
            required: [key, copy]
        modules:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              slots: { type: object }
            required: [name]
        cta:
          type: object
          properties:
            headline: { type: string }
            button_label: { type: string }
          required: [headline, button_label]
        use_looping_hero: { type: string, enum: ['true', 'false'] }
        images:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              prompt: { type: string }
              usage: { type: string }
            required: [id, prompt]
      required: [sections, modules, cta]

  # Generate the business-specific section images the plan requested (no stock). Mirrors panel-gen:
  # site-images-flatten -> a work list at $A/site/images/plan.json; the loop runs hf-image.ts (Flux) per image.
  - id: site-images-flatten
    script: site-images-flatten
    runtime: bun
    depends_on: [site-plan]
    timeout: 30000

  - id: site-images
    depends_on: [site-images-flatten]
    idle_timeout: 1200000
    loop:
      prompt: |
        FRESH iteration — no memory. State lives in $ARTIFACTS_DIR/site/images/plan.json. The image prompts were
        ALREADY WRITTEN by site-plan — you do NOT change any prompt; you ONLY execute. Every plan-step.ts call MUST
        be prefixed `ARTIFACTS_DIR="$ARTIFACTS_DIR"`.

        1. Next image:  ARTIFACTS_DIR="$ARTIFACTS_DIR" bun .archon/scripts/plan-step.ts --next site-images
           If it prints NONE → output <promise>IMAGES_DONE</promise> and stop.
        2. Parse the item JSON: id, out, prompt.
        3. Write the item's prompt VERBATIM to $ARTIFACTS_DIR/site/images/<id>.prompt.txt — do NOT edit it.
        4. Generate (Flux.2 Pro, 2k, 16:9):
           bun .archon/scripts/hf-image.ts --prompt-file <pf> --out <out> --resolution 2k
        5. If the output image exists:  ARTIFACTS_DIR="$ARTIFACTS_DIR" bun .archon/scripts/plan-step.ts --mark-done site-images <id>
           If generation errored transiently, do NOT mark done — end the turn so it retries.
        6. Do exactly ONE image per iteration, then end your turn.
      until: IMAGES_DONE
      max_iterations: 12
      fresh_context: true
      until_bash: 'ARTIFACTS_DIR="$ARTIFACTS_DIR" bun .archon/scripts/plan-step.ts --all-done site-images'

  # AI-CRAFTED content body (replaces the template-stitched sections). An opus designer-developer writes the
  # content sections + CTA as bespoke HTML/CSS, using the generated section images + brand variables, with full
  # layout latitude per the interview input. The assembler then wraps it with the sacred scroll-frame hero/
  # showcase engine + head + nav (which it still wires deterministically).
  - id: site-build
    command: site-build
    depends_on: [site-images]
    context: fresh
    model: opus
    skills: [cinematic-site-kit-higgsfield]
    allowed_tools: [Read, Write]

  - id: assemble-site
    script: assemble-site
    runtime: bun
    depends_on: [site-build]
    timeout: 120000

  - id: build-check
    script: build-check
    runtime: bun
    depends_on: [assemble-site]
    timeout: 60000

  - id: site-critic
    prompt: |
      You are a strict final-site critic. Read the rubric at .archon/assets/cinematic/rubrics/site.md and
      apply it VERBATIM. Judge the assembled $ARTIFACTS_DIR/site/index.html plus the deterministic results
      in $ARTIFACTS_DIR/site/build-check.json. Cover the subjective remainder the script can't: legibility,
      copy quality, "go all out", module fit. Write the verdict to $ARTIFACTS_DIR/site/site-verdict.json,
      then return the same verdict.
    depends_on: [build-check]
    context: fresh
    allowed_tools: [Read, Write]
    output_format:
      type: object
      properties:
        verdict: { type: string, enum: [PASS, FAIL] }
        reasons: { type: array, items: { type: string } }
        fixes: { type: array, items: { type: string } }
      required: [verdict, reasons, fixes]

  - id: site-gate
    approval:
      message: |
        STEP 3 (SITE) — Open $ARTIFACTS_DIR/site/index.html and scroll it. Deterministic checklist:
        $ARTIFACTS_DIR/site/build-check.json. Critic: $ARTIFACTS_DIR/site/site-verdict.json.
        Approve to deploy, or reject with specific tweaks.
      capture_response: true
      on_reject:
        prompt: |
          Address the build-check failures ($ARTIFACTS_DIR/site/build-check.json), the critic reasons
          ($ARTIFACTS_DIR/site/site-verdict.json), and this human feedback: $REJECTION_REASON.
          For CONTENT/LAYOUT/imagery tweaks: edit the AI-crafted body at $ARTIFACTS_DIR/site/content.html directly
          (follow the .archon/commands/site-build.md rules — brand vars, generated images/<id>.png only, no stock,
          `reveal` class, both-side padding, CTA last). For a NEW image, add it to $ARTIFACTS_DIR/site/site-plan.json
          `images[]`, run `bun .archon/scripts/site-images-flatten.ts`, generate it with `bun .archon/scripts/hf-image.ts`,
          then reference `images/<id>.png` in content.html. Then ALWAYS re-run `bun .archon/scripts/assemble-site.ts`
          and `bun .archon/scripts/build-check.ts`. Never hand-edit index.html (the assembler regenerates it).
        max_attempts: 5
    depends_on: [build-check, site-critic]

  # ════════════════════════════════ I. DEPLOY ════════════════════════════════
  - id: deploy
    command: deploy-finalize
    depends_on: [site-gate]
    context: fresh
    skills: [cinematic-site-kit-higgsfield]
    idle_timeout: 600000

  - id: report
    bash: |
      echo "===================== CINEMATIC SITE — DELIVERY ====================="
      cat "$ARTIFACTS_DIR/deploy-summary.md" 2>/dev/null || echo "deploy-summary.md not found"
      echo "===================================================================="
    depends_on: [deploy]
    trigger_rule: all_done
