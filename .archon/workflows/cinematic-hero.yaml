name: cinematic-hero
description: |
  Cinematic HERO video via the START+END method — a ~5s above-the-fold arrival. It reuses the showcase Director
  and all its prompting lessons (one opus Director designs the same-style scene panels + one Seedance flythrough
  prompt, self-critiqued against rubrics/grid.md: grid/heading path, no-glimpse, zero-remnants), but the hero is a
  single A->B arrival, so instead of the showcase's composited grid it designs EXACTLY 2 panels and feeds Seedance
  panel 1 as the START frame and panel 2 as the END frame — Seedance locks onto both frames and interpolates the
  journey between them. Crucially it KEEPS the deterministic door handling (door-check observes the rendered handle
  side; door-swing computes hinge = opposite handle, swing = hinge side, and rewrites the door clause). A
  storyboard grid is still composited for door-check and human review, but it is NOT the render input.
  Use to generate a standalone above-the-fold hero background video for a brand.
  NOT the full cinematic-site build (intake/brand/showcase/site/deploy) — this is the hero only.
provider: claude
model: sonnet
interactive: true
thinking: adaptive
worktree:
  enabled: false  # in-place (untracked build)

nodes:
  # ──────────────────────────── PREFLIGHT ────────────────────────────
  - id: preflight
    script: preflight
    runtime: bun
    timeout: 90000

  - id: require-higgsfield
    cancel: "Higgsfield CLI not found or not authenticated. Install it and run `higgsfield auth login`, then re-run."
    depends_on: [preflight]
    when: "$preflight.output.higgsfield == 'false'"

  - id: require-imagemagick
    cancel: "ImageMagick (magick) is required to composite the storyboard grid. Install it (brew install imagemagick) and re-run."
    depends_on: [preflight]
    when: "$preflight.output.imagemagick == 'false'"

  # ──────────────────────────── DIRECTOR (the grid spec) — shared showcase-director ────────────────────────────
  - id: showcase-director
    command: showcase-director
    depends_on: [preflight]
    when: "$preflight.output.higgsfield == 'true'"
    context: fresh
    model: opus
    skills: [cinematic-site-kit-higgsfield]
    output_format:
      type: object
      properties:
        style: { type: object }
        grid:
          type: object
          properties:
            cols: { type: integer, minimum: 1, maximum: 2 }
            rows: { type: integer, minimum: 1, maximum: 2 }
          required: [cols, rows]
        panels:                       # the hero is a START+END pair: EXACTLY 2 panels (panel 1 = start, panel 2 = end)
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            properties:
              id: { type: string }
              scene_label: { type: string }
              composition: { type: string }
              nb_prompt: { type: string }
            required: [id, composition, nb_prompt]
        flythrough_prompt: { type: string }
        duration: { type: integer, minimum: 4, maximum: 15 }
      required: [style, grid, panels, flythrough_prompt, duration]

  # AUTO-REVISE LOOP — identical to the showcase: the Director self-critiques the spec against rubrics/grid.md and
  # revises until it PASSes, BEFORE any panel is generated.
  - id: refine-loop
    depends_on: [showcase-director]
    idle_timeout: 600000
    loop:
      prompt: |
        You are the showcase Director acting as your own STRICT critic-and-reviser. Converge the storyboard spec
        to clean BEFORE any panel is generated. State lives in $ARTIFACTS_DIR/showcase/grid-spec.json and
        $ARTIFACTS_DIR/showcase/grid-verdict.json. Original brief: $ARGUMENTS

        1. CRITIQUE — read $ARTIFACTS_DIR/showcase/grid-spec.json and apply the rubric at
           .archon/assets/cinematic/rubrics/grid.md VERBATIM and strictly. Pay special attention to the HARD
           spatial checks: every turn names a HORIZONTAL direction (incl. the turn before a vertical move); each
           turn's named direction MATCHES the panel layout it reveals (cross-check against each panel's
           composition); no two same-direction turns that U-turn into a space already shown; tight (<500 chars);
           no rig/aircraft words ("flight/drone/aerial/fly…"); ends on the final reveal (no padding closing).
           Write your honest verdict {verdict,reasons[],fixes[]} to $ARTIFACTS_DIR/showcase/grid-verdict.json.
        2. REVISE — if the verdict is FAIL, edit $ARTIFACTS_DIR/showcase/grid-spec.json to fix EVERY reason.
           Where a turn can't be both correct (matching its panel) AND paradox-free, RESTRUCTURE the path:
           re-order panels, route through a doorway, or use a level change — and update the affected panels'
           nb_prompt/composition to match. Keep every other rule satisfied. Then re-write grid-verdict.json for
           the REVISED spec.
        3. SIGNAL — only if the spec now genuinely PASSes every check, output <promise>SPEC_OK</promise>.
           Otherwise end your turn and you will iterate again.
        Do NOT generate any images. Only read/edit grid-spec.json and grid-verdict.json.
      until: SPEC_OK
      max_iterations: 5
      fresh_context: true
      until_bash: 'ARTIFACTS_DIR="$ARTIFACTS_DIR" bun .archon/scripts/grid-verdict-passed.ts'

  # HERO DIFFERENCE — force the render to ~5s. The shared showcase-director may set any 4–15s duration; the hero is
  # a short above-the-fold intro, so we deterministically pin grid-spec.json.duration = 5 (door-swing later
  # preserves it; gen-flythrough reads it). This is the ONLY behavioral change from the showcase.
  - id: hero-set-duration
    script: |
      const fs = require("node:fs");
      const A = process.env.ARTIFACTS_DIR || process.argv[2];
      const p = `${A}/showcase/grid-spec.json`;
      const s = JSON.parse(fs.readFileSync(p, "utf8"));
      s.duration = 5;
      fs.writeFileSync(p, JSON.stringify(s, null, 2));
      console.log("hero-set-duration: pinned duration=5 (the hero is a ~5s intro)");
    runtime: bun
    depends_on: [refine-loop]
    timeout: 20000

  # ──────────────────────────── GENERATE PANELS → COMPOSE GRID (shared showcase scripts) ────────────────────────────
  - id: panel-flatten
    script: panel-flatten
    runtime: bun
    depends_on: [hero-set-duration]   # panels only generate AFTER the spec converges to PASS + duration pinned
    timeout: 30000

  - id: panel-gen
    depends_on: [panel-flatten]
    idle_timeout: 1200000
    loop:
      prompt: |
        FRESH iteration — no memory. State lives in $ARTIFACTS_DIR/showcase/plan.json. The panel prompts were
        ALREADY WRITTEN by the Director — you do NOT write, improve, or change any prompt. You ONLY execute.
        IMPORTANT: every plan-step.ts call MUST be prefixed `ARTIFACTS_DIR="$ARTIFACTS_DIR"` — copy verbatim.

        1. Next panel:  ARTIFACTS_DIR="$ARTIFACTS_DIR" bun .archon/scripts/plan-step.ts --next showcase
           If it prints NONE → output <promise>PANELS_DONE</promise> and stop.
        2. Parse the item JSON: id, refs[], out, prompt, scene_label.
        3. Write the item's prompt VERBATIM to $ARTIFACTS_DIR/showcase/<id>.prompt.txt — do NOT edit it.
        4. Generate the panel (Flux.2 Pro, 2k):
           - with a ref (style anchor):  bun .archon/scripts/hf-image.ts --prompt-file <pf> --out <out> --image <refs[0]> --resolution 2k
           - first panel (no ref):       bun .archon/scripts/hf-image.ts --prompt-file <pf> --out <out> --resolution 2k
        5. If the output image exists, mark done:
             ARTIFACTS_DIR="$ARTIFACTS_DIR" bun .archon/scripts/plan-step.ts --mark-done showcase <id>
           If generation errored transiently, do NOT mark done — end the turn so it retries next iteration.
        6. Do exactly ONE panel per iteration, then end your turn.
      until: PANELS_DONE
      max_iterations: 24
      fresh_context: true
      until_bash: 'ARTIFACTS_DIR="$ARTIFACTS_DIR" bun .archon/scripts/plan-step.ts --all-done showcase'

  - id: compose-grid
    script: compose-grid
    runtime: bun
    depends_on: [panel-gen]
    timeout: 120000

  # DOOR — the reliability piece the hand-rolled hero lacked. door-check (vision) reports which side the handle is
  # on; door-swing (deterministic) computes hinge = opposite handle, swing = hinge side, and rewrites the door
  # clause — so Seedance opens the door the correct way instead of hallucinating it.
  - id: door-check
    command: door-check
    depends_on: [compose-grid]
    context: fresh
    model: opus
    allowed_tools: [Read, Write]
    output_format:
      type: object
      properties:
        hinged_door: { type: string, enum: [yes, no] }
        door_panel: { type: string }
        single_or_double: { type: string, enum: [single, double, n/a] }
        handle_side: { type: string, enum: [left, right, unclear, n/a] }
      required: [hinged_door, handle_side]

  - id: door-swing
    script: door-swing
    runtime: bun
    depends_on: [door-check]
    timeout: 20000

  # ──────────────────────────── GATE: review the grid BEFORE the Seedance spend ────────────────────────────
  - id: grid-gate
    approval:
      message: |
        HERO STORYBOARD — review the 2 panels BEFORE the paid render. Open
        $ARTIFACTS_DIR/scenes/showcase-grid/grid.png: panel 1 = the START frame (exterior/approach), panel 2 = the
        END frame (the interior landing) — they should read as ONE house, one light. At render, Seedance gets
        panel 1 and panel 2 as the start/end frames (this grid is only for THIS review + door-check, not the render
        input) and interpolates between them under grid-spec.json.flythrough_prompt (already a PASS verdict in
        $ARTIFACTS_DIR/showcase/grid-verdict.json via the auto-revise loop). The door-swing step has set the
        single-door swing DETERMINISTICALLY from the observed handle side (hinge = opposite handle; swing = hinge
        side). Approve to render the ~5s hero, or reject naming the panel(s) to regenerate.
      capture_response: true
      on_reject:
        prompt: |
          For the panels named in this feedback: $REJECTION_REASON — reset their status to "pending" in
          $ARTIFACTS_DIR/showcase/plan.json (and, if the prompt itself needs changing, edit that panel's
          nb_prompt in $ARTIFACTS_DIR/showcase/grid-spec.json then re-run `bun .archon/scripts/panel-flatten.ts`).
          Regenerate the reset panel(s) via `bun .archon/scripts/hf-image.ts` using their pre-written prompt,
          then re-run `bun .archon/scripts/compose-grid.ts` to rebuild the grid.
        max_attempts: 5
    depends_on: [compose-grid, door-swing]

  # ──────────────────────────── THE ONE SEEDANCE CALL (START + END frames) ────────────────────────────
  # The hero is a single A->B arrival, so Seedance gets panel 1 as the START frame and panel 2 as the END frame
  # (NOT the composited grid) and interpolates the journey under the door-swing-corrected flythrough prompt. The
  # grid still exists — door-check reads it and the human reviews it — but it is not the render input here.
  - id: gen-hero-2frame
    script: gen-hero-2frame
    runtime: bun
    depends_on: [grid-gate]
    timeout: 1500000   # one Seedance render (up to ~20m internal wait)
    retry:
      max_attempts: 2
      delay_ms: 8000

  - id: showcase-gate
    approval:
      message: |
        HERO — the single continuous ~5s arrival at $ARTIFACTS_DIR/scenes/showcase/showcase-video.mp4
        (one Seedance render that INTERPOLATES panel 1 -> panel 2 as the start and end frames — no grid composite,
        no seams). Watch it: it should travel from the exterior, through the opening door, into the interior as one
        continuous move and LAND on panel 2, the single door opening the correct way. Approve, or reject to
        re-render (tweak the flythrough prompt in grid-spec.json — keeping it duration-free — or regenerate a panel).
      capture_response: true
      on_reject:
        prompt: |
          Address this feedback: $REJECTION_REASON. If it's the camera/journey, edit
          $ARTIFACTS_DIR/showcase/grid-spec.json flythrough_prompt (NEVER add a duration/timestamp to it) and
          re-run `bun .archon/scripts/gen-hero-2frame.ts`. If a panel is wrong, reset it in plan.json, regenerate
          via hf-image.ts, re-run `bun .archon/scripts/compose-grid.ts` (for door-check/review), then
          `bun .archon/scripts/gen-hero-2frame.ts`.
        max_attempts: 4
    depends_on: [gen-hero-2frame]

  - id: report
    bash: |
      echo "================= CINEMATIC HERO (START+END frames, ~5s) — DELIVERY ================="
      echo "Hero video:      $ARTIFACTS_DIR/scenes/showcase/showcase-video.mp4  (Seedance start=panel1 -> end=panel2)"
      echo "Start/end frames:$ARTIFACTS_DIR/scenes/showcase-grid/{p1,p2}.png"
      echo "Storyboard grid: $ARTIFACTS_DIR/scenes/showcase-grid/grid.png  (door-check + human review only)"
      echo "Grid spec:       $ARTIFACTS_DIR/showcase/grid-spec.json"
      echo "===================================================================================="
    depends_on: [showcase-gate]
    trigger_rule: all_done
