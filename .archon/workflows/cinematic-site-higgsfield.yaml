name: cinematic-site-higgsfield
description: |
  Turn an existing website or a business idea into a cinematic, scroll-animated
  landing page with an AI-generated hero video (Higgsfield: Nano Banana Pro images +
  Seedance 2.0 Fast video), then build the site and deploy it.
  Use when the user wants a cinematic / scrollytelling landing page, a hero video
  background, or wants to make a brand's site feel "cinematic" — with Higgsfield as
  the generation backend. Runs the cinematic-site-kit-higgsfield skill's 5-step
  pipeline as gated nodes: intake -> brand analysis -> scene/video generation ->
  scroll-animated HTML build -> deploy. Each creative step pauses for human approval
  with on-reject rework. Does NOT generate generic product photos or Remotion videos.

# Foreground execution + chat-delivered gates. REQUIRED: this workflow has approval gates.
interactive: true

provider: claude
model: sonnet            # workflow default; quality-critical nodes override to opus below
thinking: adaptive       # the director's-brief reasoning and prompt-writing benefit from it

worktree:
  enabled: true          # generates assets + a site and runs git/deploy — always isolate

nodes:
  # ── Layer 0 — deterministic preflight (no AI) ──────────────────────────────
  # Emits a single valid JSON object so downstream when:/cancel can read fields.
  - id: preflight
    bash: |
      set +e
      have(){ command -v "$1" >/dev/null 2>&1 && echo true || echo false; }
      HF=$(have higgsfield); FFMPEG=$(have ffmpeg); VERCEL=$(have vercel)
      GH=$(have gh); GIT=$(have git); AUTHED=false
      if [ "$HF" = "true" ]; then
        if higgsfield account status >/dev/null 2>&1; then AUTHED=true; fi
      fi
      printf '{"higgsfield":%s,"ffmpeg":%s,"vercel":%s,"gh":%s,"git":%s,"higgsfield_authed":%s}\n' \
        "$HF" "$FFMPEG" "$VERCEL" "$GH" "$GIT" "$AUTHED"
    timeout: 45000

  # Hard precondition: the entire kit generates through the Higgsfield CLI.
  - id: require-higgsfield
    cancel: |
      Higgsfield CLI not found. This kit generates ALL images (Nano Banana Pro) and
      video (Seedance 2.0 Fast) through it. Install + sign in, then re-run:
        curl -fsSL https://raw.githubusercontent.com/higgsfield-ai/cli/main/install.sh | sh
        higgsfield auth login
    depends_on: [preflight]
    when: "$preflight.output.higgsfield == 'false'"

  # ── Step 0 — Client Intake ─────────────────────────────────────────────────
  - id: intake
    command: cinematic-intake
    depends_on: [preflight]
    when: "$preflight.output.higgsfield == 'true'"
    skills:
      - cinematic-site-kit-higgsfield

  - id: intake-gate
    approval:
      message: |
        Step 0 — Intake. I drafted my understanding of the business + the open
        questions in the report above (full brief: $ARTIFACTS_DIR/intake-brief.md).
        • To refine: REJECT with your answers/corrections — I'll fold them in and
          re-ask. Repeat until it's accurate. (Per the kit: do NOT guess the business,
          location, or customers — these must be right before any copy is written.)
        • When the brief is accurate, APPROVE (optionally add any last details).
      capture_response: true
      on_reject:
        prompt: |
          The user answered the intake questions / corrected the brief:
          $REJECTION_REASON

          Update $ARTIFACTS_DIR/intake-brief.md to incorporate every answer, resolve
          the questions it addresses, and re-list any questions still open. Be a
          pleasantly persistent colleague — if an answer is still vague (regional not
          city-specific, service scope unclear, brands unnamed), ask the precise
          follow-up. Then summarize the updated brief and remaining gaps.
        max_attempts: 6
    depends_on: [intake]

  # ── Step 1 — Brand Analysis ────────────────────────────────────────────────
  - id: brand-analysis
    command: cinematic-brand-analysis
    depends_on: [intake-gate]
    skills:
      - cinematic-site-kit-higgsfield

  - id: brand-gate
    approval:
      message: |
        Step 1 — Brand Card. Open $ARTIFACTS_DIR/brand/brand-card.html to review the
        palette, type, copy, and creative direction.
        • To adjust: REJECT with what to change (e.g. "warmer palette", "more premium
          serif", "tighten the tagline") — I'll revise the card.
        • Happy with it? APPROVE to start scene/video generation.
      on_reject:
        prompt: |
          Revise the brand card per this feedback: $REJECTION_REASON
          Update $ARTIFACTS_DIR/brand/brand-card.html and brand-system.md accordingly,
          keeping everything else consistent. Summarize what changed.
        max_attempts: 5
    depends_on: [brand-analysis]

  # ── Step 2 — Scene Generation (THE most important step) ────────────────────
  - id: scene-generation
    command: cinematic-scene-generation
    depends_on: [brand-gate]
    model: opus               # the kit's most important step — director's brief + prompt craft
    idle_timeout: 1800000     # 30 min — Seedance/NB Pro --wait calls block without streaming
    skills:
      - cinematic-site-kit-higgsfield
      - higgsfield-generate
      - higgsfield-soul-id
      - higgsfield-product-photoshoot

  - id: scene-gate
    approval:
      message: |
        Step 2 — Video. Review the generated hero variants (and any showcase /
        before-after assets) listed in $ARTIFACTS_DIR/scenes/scene-manifest.md.
        • APPROVE and tell me which hero variant to use (e.g. "use variant 2").
        • To fix: REJECT and say what's wrong (e.g. "hero camera too static",
          "showcase scene 2 bifold morphs") — I'll regenerate just those assets.
        Reminder from the kit: a bad video = a bad site, so don't settle.
      capture_response: true
      on_reject:
        prompt: |
          Regenerate / fix only the assets called out here: $REJECTION_REASON
          Apply the kit's Step 2 diagnosis table (Ken-Burns-only -> add subject motion;
          flat -> camera must travel through space from 0s; morphing -> add the
          no-morphing physics constraint; etc.). Update the affected files in
          $ARTIFACTS_DIR/scenes/ and refresh scene-manifest.md. Summarize what changed.
        max_attempts: 5
    depends_on: [scene-generation]

  # ── Step 3 — Website Build ─────────────────────────────────────────────────
  - id: website-build
    command: cinematic-website-build
    depends_on: [scene-gate]
    model: opus               # complex single-file scroll-animated build benefits from it
    idle_timeout: 900000      # 15 min — frame extraction + full single-file build
    skills:
      - cinematic-site-kit-higgsfield

  - id: site-gate
    approval:
      message: |
        Step 3 — Site. The scroll-animated single-file site is at
        $ARTIFACTS_DIR/site/index.html (also in the repo working dir). Open it and
        scroll: the hero video should advance frame-by-frame, then the page flows on.
        • To iterate: REJECT with tweaks (copy, spacing, a module, mobile) — I'll edit.
        • APPROVE to deploy.
      on_reject:
        prompt: |
          Edit the site per this feedback: $REJECTION_REASON
          Keep it a single self-contained index.html, keep all scroll animations
          bidirectional, keep text legible on dark. Update both the repo copy and
          $ARTIFACTS_DIR/site/index.html. Summarize what changed.
        max_attempts: 5
    depends_on: [website-build]

  # ── Step 4 — Deploy ────────────────────────────────────────────────────────
  - id: deploy
    command: cinematic-deploy
    depends_on: [site-gate]
    idle_timeout: 600000
    skills:
      - cinematic-site-kit-higgsfield
