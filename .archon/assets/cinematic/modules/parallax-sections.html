<!-- CINEMATIC MODULE: Parallax Sections — Best for: Story sections, features -->
<style>
.parallax-section { position:relative; overflow:hidden; min-height:80vh; display:flex; align-items:center; }
.parallax-bg { position:absolute; inset:-20% 0; z-index:0; }
.parallax-bg img { width:100%; height:100%; object-fit:cover; will-change:transform; }
.parallax-overlay { position:absolute; inset:0; background:linear-gradient(135deg,rgba(0,0,0,0.7),rgba(0,0,0,0.3)); z-index:1; }
.parallax-content { position:relative; z-index:2; max-width:700px; padding:clamp(2rem,5vw,6rem); }
.parallax-content h2 { font-family:var(--font-heading,serif); font-size:clamp(2rem,5vw,3.5rem); color:#fff; margin-bottom:1.5rem; line-height:1.15; }
.parallax-content p { font-family:var(--font-body,sans-serif); font-size:clamp(1rem,1.2vw,1.2rem); color:rgba(255,255,255,0.75); line-height:1.7; margin-bottom:1rem; }
.parallax-divider { width:60px; height:2px; background:var(--color-primary,#c8a97e); margin-bottom:1.5rem; }
.parallax-content>*{opacity:0;transform:translateY(30px);transition:all 0.6s cubic-bezier(0.22,1,0.36,1);}
.parallax-section.in-view .parallax-content>*{opacity:1;transform:translateY(0);}
.parallax-section.in-view .parallax-content>*:nth-child(2){transition-delay:0.15s} .parallax-section.in-view .parallax-content>*:nth-child(3){transition-delay:0.3s}
</style>
<section class="parallax-section" data-parallax>
  <div class="parallax-bg"><img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1400&q=80" alt=""></div>
  <div class="parallax-overlay"></div>
  <div class="parallax-content"><div class="parallax-divider"></div><h2>Built to Last</h2><p>Craftsmanship, accountability, and work that holds up — every project, start to finish.</p></div>
</section>
<script>
function updateParallax(){document.querySelectorAll('[data-parallax]').forEach(s=>{const r=s.getBoundingClientRect();const bg=s.querySelector('.parallax-bg');if(bg)bg.style.transform='translate3d(0,'+r.top*0.3+'px,0)';});requestAnimationFrame(updateParallax);}requestAnimationFrame(updateParallax);
const pObs=new IntersectionObserver(e=>{e.forEach(x=>{if(x.isIntersecting)x.target.classList.add('in-view');});},{threshold:0.15});
document.querySelectorAll('.parallax-section').forEach(el=>pObs.observe(el));
</script>
