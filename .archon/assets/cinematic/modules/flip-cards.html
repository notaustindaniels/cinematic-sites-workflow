<!-- CINEMATIC MODULE: Flip Cards — Best for: Testimonials, team, features -->
<style>
.flip-cards-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:2rem; padding:2rem; }
.flip-card { perspective:1000px; height:380px; cursor:pointer; }
.flip-card-inner { position:relative; width:100%; height:100%; transition:transform 0.8s cubic-bezier(0.22,1,0.36,1); transform-style:preserve-3d; }
.flip-card:hover .flip-card-inner { transform:rotateY(180deg); }
.flip-card-front,.flip-card-back { position:absolute; inset:0; backface-visibility:hidden; border-radius:16px; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; padding:2rem; }
.flip-card-front { background-size:cover; background-position:center; }
.flip-card-front::after { content:''; position:absolute; inset:0; background:linear-gradient(to top,rgba(0,0,0,0.7),transparent 60%); }
.flip-card-front h3,.flip-card-front p { position:relative; z-index:1; color:#fff; }
.flip-card-front h3 { font-family:var(--font-heading,serif); font-size:1.5rem; margin-bottom:0.25rem; }
.flip-card-front p { font-size:0.85rem; opacity:0.7; }
.flip-card-back { background:var(--color-primary,#c8a97e); transform:rotateY(180deg); justify-content:center; align-items:center; text-align:center; }
.flip-card-back p { font-family:var(--font-body,sans-serif); font-size:1rem; color:#fff; line-height:1.6; max-width:90%; }
@media(hover:none){.flip-card.flipped .flip-card-inner{transform:rotateY(180deg);}}
</style>
<div class="flip-cards-grid">
  <div class="flip-card"><div class="flip-card-inner"><div class="flip-card-front" style="background-image:url('https://images.unsplash.com/photo-1560066984-138dadb4c035?w=600&q=80')"><h3>Feature One</h3><p>Hover to learn more</p></div><div class="flip-card-back"><p>Detailed description here.</p></div></div></div>
</div>
<script>if('ontouchstart' in window){document.querySelectorAll('.flip-card').forEach(c=>{c.addEventListener('click',()=>c.classList.toggle('flipped'));});}</script>
