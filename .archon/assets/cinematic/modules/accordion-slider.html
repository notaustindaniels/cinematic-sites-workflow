<!--
  CINEMATIC MODULE: Accordion Slider
  Best for: Menus, product categories, image galleries
-->
<style>
.accordion-slider { display:flex; height:70vh; min-height:500px; overflow:hidden; border-radius:16px; gap:4px; }
.accordion-panel { flex:1; position:relative; cursor:pointer; overflow:hidden; transition:flex 0.7s cubic-bezier(0.22,1,0.36,1); }
.accordion-panel:hover, .accordion-panel.active { flex:5; }
.accordion-panel img { width:100%; height:100%; object-fit:cover; transition:transform 0.7s cubic-bezier(0.22,1,0.36,1); }
.accordion-panel:hover img { transform:scale(1.05); }
.accordion-panel .panel-overlay { position:absolute; inset:0; background:linear-gradient(to top,rgba(0,0,0,0.8) 0%,rgba(0,0,0,0.1) 50%,transparent 100%); display:flex; flex-direction:column; justify-content:flex-end; padding:2rem; opacity:0; transition:opacity 0.5s ease; }
.accordion-panel:hover .panel-overlay, .accordion-panel.active .panel-overlay { opacity:1; }
.panel-overlay h3 { font-family:var(--font-heading,serif); font-size:clamp(1.2rem,2.5vw,2rem); color:#fff; margin-bottom:0.5rem; transform:translateY(20px); transition:transform 0.5s cubic-bezier(0.22,1,0.36,1) 0.1s; }
.accordion-panel:hover .panel-overlay h3 { transform:translateY(0); }
.panel-overlay p { font-family:var(--font-body,sans-serif); font-size:0.9rem; color:rgba(255,255,255,0.7); transform:translateY(20px); transition:transform 0.5s cubic-bezier(0.22,1,0.36,1) 0.2s; }
.accordion-panel:hover .panel-overlay p { transform:translateY(0); }
.panel-number { position:absolute; top:1.5rem; left:50%; transform:translateX(-50%); font-size:0.75rem; letter-spacing:0.2em; color:rgba(255,255,255,0.4); writing-mode:vertical-rl; transition:opacity 0.3s; }
.accordion-panel:hover .panel-number { opacity:0; }
@media (max-width:768px) { .accordion-slider { flex-direction:column; height:auto; } .accordion-panel { height:200px; flex:none; } .accordion-panel:hover,.accordion-panel.active { height:400px; flex:none; } }
</style>
<div class="accordion-slider">
  <div class="accordion-panel"><span class="panel-number">01</span><img src="https://images.unsplash.com/photo-1557682250-33bd709cbe85?w=600&q=80" alt=""><div class="panel-overlay"><h3>Category Title</h3><p>Description here</p></div></div>
  <div class="accordion-panel"><span class="panel-number">02</span><img src="https://images.unsplash.com/photo-1557682224-5b8590cd9ec5?w=600&q=80" alt=""><div class="panel-overlay"><h3>Category Title</h3><p>Description here</p></div></div>
  <div class="accordion-panel"><span class="panel-number">03</span><img src="https://images.unsplash.com/photo-1557682260-96773eb01377?w=600&q=80" alt=""><div class="panel-overlay"><h3>Category Title</h3><p>Description here</p></div></div>
  <div class="accordion-panel"><span class="panel-number">04</span><img src="https://images.unsplash.com/photo-1557682268-e3955ed5d83f?w=600&q=80" alt=""><div class="panel-overlay"><h3>Category Title</h3><p>Description here</p></div></div>
</div>
<script>
document.querySelectorAll('.accordion-panel').forEach(p=>{p.addEventListener('click',()=>{document.querySelectorAll('.accordion-panel').forEach(x=>x.classList.remove('active'));p.classList.toggle('active');});});
</script>
