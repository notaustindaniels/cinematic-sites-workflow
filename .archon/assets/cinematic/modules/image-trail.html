<!-- CINEMATIC MODULE: Image Trail Cursor — Best for: Creative brands, portfolios -->
<style>
.image-trail-section { position:relative; min-height:80vh; overflow:hidden; cursor:none; display:flex; align-items:center; justify-content:center; }
.trail-image { position:fixed; width:160px; height:200px; object-fit:cover; border-radius:8px; pointer-events:none; z-index:100; opacity:0; transform:scale(0.5); transition:opacity 0.3s ease,transform 0.3s ease; box-shadow:0 10px 40px rgba(0,0,0,0.3); }
.trail-image.visible { opacity:1; transform:scale(1) rotate(var(--rot,0deg)); }
.trail-image.fading { opacity:0; transform:scale(0.8) rotate(var(--rot,0deg)); transition:opacity 0.8s,transform 0.8s; }
.image-trail-section .center-text { font-family:var(--font-heading,serif); font-size:clamp(2rem,6vw,5rem); color:#fff; text-align:center; position:relative; z-index:50; pointer-events:none; }
</style>
<section class="image-trail-section" data-image-trail><h2 class="center-text">Explore Our Collection</h2></section>
<script>
(function(){const imgs=['https://images.unsplash.com/photo-1490750967868-88aa4f44baee?w=300&q=80','https://images.unsplash.com/photo-1455659817273-f96807779a8a?w=300&q=80','https://images.unsplash.com/photo-1487530811176-3780de880c2d?w=300&q=80','https://images.unsplash.com/photo-1468327768560-75b778cbb551?w=300&q=80'];const sec=document.querySelector('[data-image-trail]');if(!sec)return;let idx=0,lx=0,ly=0;sec.addEventListener('mousemove',e=>{const d=Math.sqrt((e.clientX-lx)**2+(e.clientY-ly)**2);if(d<100)return;lx=e.clientX;ly=e.clientY;const i=document.createElement('img');i.classList.add('trail-image');i.src=imgs[idx%imgs.length];i.style.left=(e.clientX-80)+'px';i.style.top=(e.clientY-100)+'px';i.style.setProperty('--rot',(Math.random()-0.5)*20+'deg');document.body.appendChild(i);requestAnimationFrame(()=>i.classList.add('visible'));setTimeout(()=>{i.classList.remove('visible');i.classList.add('fading');setTimeout(()=>i.remove(),800);},1200);idx++;});})();
</script>
