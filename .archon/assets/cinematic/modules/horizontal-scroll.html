<!-- CINEMATIC MODULE: Horizontal Scroll Gallery — Best for: Product showcases, portfolios -->
<style>
.hscroll-section { position:relative; height:400vh; }
.hscroll-sticky { position:sticky; top:0; height:100vh; overflow:hidden; display:flex; align-items:center; }
.hscroll-track { display:flex; gap:2rem; padding:0 4rem; will-change:transform; }
.hscroll-card { flex-shrink:0; width:40vw; min-width:300px; height:60vh; border-radius:16px; overflow:hidden; position:relative; }
.hscroll-card img { width:100%; height:100%; object-fit:cover; transition:transform 0.6s; }
.hscroll-card:hover img { transform:scale(1.05); }
.hscroll-card .card-info { position:absolute; bottom:0; left:0; right:0; padding:2rem; background:linear-gradient(to top,rgba(0,0,0,0.8),transparent); }
.hscroll-card .card-info h3 { font-family:var(--font-heading,serif); font-size:1.5rem; color:#fff; }
.hscroll-card .card-info p { font-size:0.85rem; color:rgba(255,255,255,0.6); margin-top:0.25rem; }
@media(max-width:768px){.hscroll-card{width:80vw;}}
</style>
<section class="hscroll-section" id="hscrollSection"><div class="hscroll-sticky"><div class="hscroll-track" id="hscrollTrack">
  <div class="hscroll-card"><img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800&q=80" alt=""><div class="card-info"><h3>Product One</h3><p>Description</p></div></div>
  <div class="hscroll-card"><img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=800&q=80" alt=""><div class="card-info"><h3>Product Two</h3><p>Description</p></div></div>
  <div class="hscroll-card"><img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=800&q=80" alt=""><div class="card-info"><h3>Product Three</h3><p>Description</p></div></div>
</div></div></section>
<script>
(function(){const s=document.getElementById('hscrollSection');const t=document.getElementById('hscrollTrack');if(!s||!t)return;function u(){const r=s.getBoundingClientRect();const h=s.offsetHeight-window.innerHeight;const p=Math.min(Math.max(-r.top/h,0),1);t.style.transform='translateX('+-p*(t.scrollWidth-window.innerWidth+64)+'px)';requestAnimationFrame(u);}requestAnimationFrame(u);})();
</script>
